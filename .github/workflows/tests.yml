name: Tests and release hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CANVAS_NO_PAUSE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: canvas-sync/requirements-ai.txt
      - name: Install local extraction dependencies
        run: python -m pip install -r canvas-sync/requirements-ai.txt
      - name: Run synthetic regression tests
        run: python -B -m unittest discover -s canvas-sync/tests
      - name: Check publication contents
        run: python -B tools/check_release.py
